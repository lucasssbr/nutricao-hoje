name: Conferir e publicar

# Um único fluxo para tudo que mexe no site:
#  - pull request (e mudanças nos próprios workflows): só confere — derivados, dados, testes e páginas;
#  - push na main (Grok/Claude/Lucas): regenera derivados sobre o HEAD mais novo, confere e só então
#    grava/publica. Push que só muda dados/ (log do Grok) usa o caminho RÁPIDO: validar + testes Python,
#    sem navegadores — o código é idêntico ao que já está no ar e já passou pelas páginas (modo_verificacao.py).
#    Código novo → verificação completa (Chromium + WebKit);
#  - meia-noite de Los Angeles: fecha o dia (scripts/fechar_dia.py) e publica do mesmo jeito.
# A publicação usa scripts/publicar.sh: nunca faz rebase de derivados; se alguém enviar no meio, regenera
# e reconfere sobre o HEAD novo. O site publicado é exatamente o commit verificado (quando o Pages está
# em "GitHub Actions" — ver o passo "Modo do Pages").

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 07:05 e 08:05 UTC = 00:05 em Los Angeles (verão / inverno); 08:35 = segunda tentativa.
    # Fechamento é idempotente: fora da hora certa não muda nada.
    - cron: "5 7 * * *"
    - cron: "5 8 * * *"
    - cron: "35 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # tudo que publica na main passa em fila (nunca dois ao mesmo tempo); PRs têm fila própria.
  # queue: max = guarda TODOS os pendentes (até 100), em vez de o novo substituir o pendente — assim um push
  # não descarta o fechamento agendado da meia-noite. (Não combina com cancel-in-progress: true.)
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'publicar-main' }}
  queue: max

jobs:
  conferir:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Navegadores de teste (Chromium + WebKit)
        timeout-minutes: 15
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Derivados (só no workspace) + verificação completa
        env:
          EXIGIR_WEBKIT: "1"
        run: |
          python3 scripts/derivados.py
          bash scripts/verificar.sh

  publicar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tipo de verificação (rápida = só dados mudaram desde o que está no ar)
        id: tipo
        # push que só mexe em dados/ (log do Grok) → validar + testes Python, sem navegadores (~1–2 min no ar).
        # Código novo, meia-noite, dispatch ou qualquer dúvida → completa (Chromium + WebKit).
        run: python3 scripts/modo_verificacao.py
      - name: Cache dos navegadores
        if: steps.tipo.outputs.modo != 'rapida'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}
      - name: Navegadores de teste (Chromium + WebKit)
        if: steps.tipo.outputs.modo != 'rapida'
        # instalação travada (já passou de 20 min) não pode segurar a fila por horas (padrão do job: 6 h)
        timeout-minutes: 15
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Sincronizar, gerar, conferir e enviar
        id: pub
        env:
          # fechamento em TODA execução na main (idempotente: fora da virada não muda nada) — se um push
          # rodar no lugar do agendamento, ele mesmo fecha o dia
          PREPARO: python3 scripts/fechar_dia.py
          EXIGIR_WEBKIT: ${{ steps.tipo.outputs.modo != 'rapida' && '1' || '' }}
          SEM_PAGINAS: ${{ steps.tipo.outputs.modo == 'rapida' && '1' || '' }}
          # caminho rápido: se aparecer código novo no HEAD durante a fila, esta execução não publica
          CODIGO_BASE: ${{ steps.tipo.outputs.base }}
        run: bash scripts/publicar.sh
      - name: Modo do Pages
        id: modo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # legacy | workflow; qualquer outra resposta (HTTP 4xx/5xx persistente, JSON inválido, tipo
          # desconhecido) FALHA o job — nunca vira "modo branch" por engano (scripts/pages.py, testado)
          tipo=$(python3 scripts/pages.py modo)
          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"
          if [ "$tipo" = "legacy" ]; then
            echo "::warning::O Pages está publicando direto do branch (build_type=legacy): pushes ainda vão ao ar antes da conferência. Para publicar só o que foi verificado: Settings → Pages → Source: GitHub Actions."
          fi
      - name: Montar o site verificado
        if: steps.modo.outputs.tipo == 'workflow' && steps.pub.outputs.pular != 'sim'
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.pub.outputs.sha }}"
          mkdir -p _site
          git archive "${{ steps.pub.outputs.sha }}" | tar -x -C _site
          rm -rf _site/tests _site/.github
          printf '{"sha":"%s","verificado_em":"%s","verificacao":"%s"}\n' "${{ steps.pub.outputs.sha }}" "$(date -u +%FT%TZ)" "${{ steps.tipo.outputs.modo }}" > _site/publicado.json
      - uses: actions/upload-pages-artifact@v3
        if: steps.modo.outputs.tipo == 'workflow' && steps.pub.outputs.pular != 'sim'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.modo.outputs.tipo == 'workflow' && steps.pub.outputs.pular != 'sim'
      - name: Pedir publicação (Pages no modo branch)
        if: steps.modo.outputs.tipo == 'legacy' && steps.pub.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # push feito com GITHUB_TOKEN não dispara o build do Pages sozinho; falha de verdade se não conseguir
          python3 scripts/pages.py pedir-build

name: Fechar o dia

on:
  schedule:
    # 07:05 e 08:05 UTC = 00:05 em Los Angeles (verão / inverno). A outra execução não faz nada.
    - cron: "5 7 * * *"
    - cron: "5 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fechar-dia
  cancel-in-progress: false

jobs:
  fechar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fechar dia e abrir o novo
        run: python scripts/fechar_dia.py
      - name: Recalcular meta semanal pelo déficit
        run: python scripts/meta.py
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada a fazer."
            exit 0
          fi
          git config user.name "fechamento-automatico"
          git config user.email "fechamento-automatico@users.noreply.github.com"
          ONTEM=$(TZ=America/Los_Angeles date -d yesterday +%d/%m)
          git add -A
          git commit -m "fechar $ONTEM (automático)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "publicado=sim" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1
        id: commit
      # Push feito com GITHUB_TOKEN não dispara o GitHub Pages sozinho: pedir a publicação.
      - name: Publicar o site
        if: steps.commit.outputs.publicado == 'sim' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Não consegui pedir a publicação do Pages; o site atualiza no próximo push do Grok."

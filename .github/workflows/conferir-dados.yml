name: Conferir dados

on:
  push:
    branches: [main]
    paths:
      - "dados/**"
      - "index.html"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir JSON e contas
        run: python scripts/validar.py
